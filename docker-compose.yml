# ── Mediko Chat API + MySQL ─────────────────────────────────
# Local dev:   docker compose up --build
# Production:  same, behind a CloudPanel reverse-proxy site → 127.0.0.1:3001
#
# Secrets (OPENAI_API_KEY, SHOPIFY_*, CHAT_AGENT_SECRET, …) are read from .env
# via env_file. DB connection + HOST/NODE_ENV are overridden below so the
# api container talks to the "db" service regardless of what .env says.

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE:      ${DB_NAME:-mediko_chat}
      MYSQL_USER:          ${DB_USER:-mediko}
      MYSQL_PASSWORD:      ${DB_PASSWORD:-mediko_dev_pw}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_dev_pw}
      TZ:                  UTC
    volumes:
      - db_data:/var/lib/mysql
      # Loaded once on first init to create tables + seed data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      # Exposes MySQL to the HOST on ${DB_HOST_PORT} (default 3307 to avoid
      # clashing with a local MySQL/MariaDB already on 3306). The container
      # always listens on 3306 internally; the api service connects to db:3306.
      # Remove this line in production if only the api container needs it.
      - "${DB_HOST_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_dev_pw}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST:     0.0.0.0
      PORT:     3001
      DB_HOST:  db
      DB_PORT:  3306
      DB_USER:     ${DB_USER:-mediko}
      DB_PASSWORD: ${DB_PASSWORD:-mediko_dev_pw}
      DB_NAME:     ${DB_NAME:-mediko_chat}
    ports:
      # Bind to localhost only — CloudPanel's Nginx reverse-proxies to this.
      - "127.0.0.1:3001:3001"

volumes:
  db_data:
